# ==============================================================================
# Woltix — site configuration
#
# This site deliberately uses NO Jekyll plugins, so it builds identically
# under GitHub Pages' classic build and under a local `bundle exec jekyll`.
# sitemap.xml and robots.txt are generated from Liquid templates in the repo
# root rather than by jekyll-sitemap.
# ==============================================================================

title: "Woltix"
tagline: "Unified wealth management platform"
description: >-
  Woltix consolidates multi-custody portfolios into a real-time book of
  records, with performance, risk, rebalancing and client and regulatory
  reporting on top.

url: "https://woltix.com"
baseurl: ""
lang: "en"
encoding: "utf-8"

# No theme. The site ships its own stylesheet; without this, GitHub Pages'
# classic build silently injects jekyll-theme-primer and its stylesheet.
theme: null

# ── Company ──────────────────────────────────────────────────────────────────
company:
  legal_name: "Woltix"
  email: "contact@woltix.com"
  street: "HDS Business Centre, Tower Cluster"
  city: "Dubai"
  country: "United Arab Emirates"
  country_code: "AE"
  linkedin: "https://www.linkedin.com/company/woltix"

# ── Search engine verification ───────────────────────────────────────────────
# These verify domain ownership in Search Console / Webmaster. They are
# unrelated to analytics and are safe to serve without consent.
verification:
  google: "UwcAsghYVeWxHOHeE1snkkfFICt-3PGln0P0CUeU8oc"
  yandex: "7f5d9e35262393e5"

# ── Analytics ────────────────────────────────────────────────────────────────
# GA4 only. Loaded through Google Consent Mode v2 and gated on opt-in —
# see _includes/analytics.html. Leave blank to disable analytics entirely.
analytics:
  ga4_id: "G-ZNPYHBG9EQ"

# ── Forms ────────────────────────────────────────────────────────────────────
forms:
  pageclip_endpoint: "https://send.pageclip.co/J3apqUgEMiWapr2MUAe81pPRVcOJ0Chs/contact-form"

# ── Social sharing ───────────────────────────────────────────────────────────
og_image: "/assets/images/og-default.png"

# ── Build ────────────────────────────────────────────────────────────────────
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - Gemfile.pages
  - Gemfile.pages.lock
  - _site_pages
  - README.md
  - vendor
  - .idea
  - .ruby-lsp
  - node_modules

defaults:
  - scope:
      path: ""
    values:
      layout: "page"
      # Pages opt in to indexing; anything that forgets to is still indexed,
      # but set `noindex: true` in front matter to keep a page out of Google
      # and out of sitemap.xml.
      noindex: false
      sitemap: true
